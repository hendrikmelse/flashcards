name: CI

on:
  push:
    branches: [main]
    # Changes that cannot affect the built app do not need a build or a deploy.
    # (deploy/** is copied to the server by hand; see deploy/README.md.)
    paths-ignore:
      - "**.md"
      - "deploy/**"
      - ".gitattributes"
  pull_request:
  # A manual "Run workflow" button in the Actions tab. On main it builds and,
  # if DEPLOY_ENABLED is set, redeploys: handy to redeploy without a commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests use in-memory Postgres (PGlite), so no database service is needed.
      - run: npm test
      - run: npm run build

  # Builds the production image on every run (proving the Dockerfile works) and
  # pushes it to GitHub Container Registry only for pushes to main.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        # Image names must be lowercase; tag by commit so every deploy is
        # traceable and rollback is just "deploy the previous tag".
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stays off until the server exists: set the repository variable
  # DEPLOY_ENABLED=true and the secrets listed in deploy/README.md.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.image.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          # The deploy key is restricted on the server to one forced command
          # (ci-entrypoint.sh), which accepts exactly "deploy <image> <actor>",
          # logs in to the registry with the token read from stdin, and runs
          # deploy.sh. The token is the job's short-lived one; nothing
          # long-lived for the registry is stored on the server.
          printf '%s' "$TOKEN" | ssh -i key -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $IMAGE $ACTOR"
