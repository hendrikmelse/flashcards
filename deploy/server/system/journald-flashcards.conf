# Installed as /etc/systemd/journald.conf.d/flashcards.conf
#
# Container logs (app, Postgres, Caddy) are sent to the host journal so they
# survive container recreation, which happens on every deploy. Keep them on
# disk across reboots, but cap the size and age so they cannot fill the disk.
[Journal]
Storage=persistent
SystemMaxUse=500M
MaxRetentionSec=30day
