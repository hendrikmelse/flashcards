# Shared reverse proxy for every app on this server. It owns ports 80/443,
# obtains and renews HTTPS certificates automatically, and routes each domain
# to its app over the shared "web" network.
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    networks:
      - web
    # Logs go to the host's journal, which outlives the container (see
    # deploy/README.md, "Logs"). Read them with: sudo journalctl -t caddy
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: web
