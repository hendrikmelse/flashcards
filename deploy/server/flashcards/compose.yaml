# The flashcards app. Its image is built and pushed by CI (.github/workflows);
# deploy.sh sets IMAGE to the commit being deployed.
services:
  api:
    image: ${IMAGE:?set IMAGE, e.g. by running deploy.sh}
    container_name: flashcards-api
    restart: unless-stopped
    env_file: .env # DATABASE_URL (see .env.example)
    environment:
      NODE_ENV: production
      # Safe because the only way to reach this container is through Caddy on
      # the internal network; never publish its port.
      TRUST_PROXY: "true"
      # Invite-only: only the emails in ALLOWED_EMAILS (set in .env) may register.
      REGISTRATION_MODE: allowlist
      # Email (verification, password reset) goes out through Resend. The API key is a secret,
      # so it is in .env; the rest is not. The links in emails start with PUBLIC_URL: change it
      # and MAIL_FROM when the app moves to another domain.
      PUBLIC_URL: https://flashcards.hendrikmelse.com
      MAIL_FROM: Language Flashcards <noreply@mail.hendrikmelse.com>
    networks:
      - web # reached by Caddy
      - db # reaches Postgres
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Logs go to the host's journal, which outlives the container, so they
    # survive every deploy (see deploy/README.md, "Logs"). Read them with:
    #   sudo journalctl -t flashcards-api
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

networks:
  web:
    external: true
    name: web
  db:
    external: true
    name: db
